name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Compile and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      # The web targets are the ones a JVM-only run cannot speak for: a value
      # class without its `kotlin.jvm.JvmInline` import compiles on the JVM and
      # nowhere else.
      - name: Compile every target the runner can build
        run: ./gradlew compileKotlinJvm compileTestKotlinJvm compileKotlinWasmJs compileKotlinJs

      # Everything except what reads the original game data, which is not in
      # the repository. See NeedsGameData.
      - name: Test
        run: ./gradlew :composeApp:jvmTest -PwithoutGameData

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: composeApp/build/reports/tests/jvmTest/
