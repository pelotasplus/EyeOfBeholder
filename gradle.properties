#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false

# Both are deprecated and both have to stay. AGP 9 refuses to apply
# com.android.application alongside the Kotlin multiplatform plugin at all,
# and names this pair as the way to bypass that; without them the build fails
# in configuration. They go when the Android app moves into a subproject of
# its own that depends on the multiplatform one, which is what AGP wants and
# what the deprecation is for.
android.builtInKotlin=false
android.newDsl=false
