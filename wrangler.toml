# Cloudflare config for the web (wasmJs) build.
#
# eob2.pelotasplus.dev is a Worker with static assets (Workers Assets), same
# setup as the Dreszcz project. Deploy with:
#   wrangler deploy
#
# `name` MUST match the existing Worker, or a new one is created. Check with:
#   npx wrangler deployments list --name eob2
name = "eob2"
compatibility_date = "2024-11-01"

# Wrangler runs this before deploy and dev, so the assets directory below is
# always freshly built. A concurrent wasmJsBrowserDevelopmentRun --continuous
# fights this task over build/wasm/packages — stop the dev server first.
[build]
command = "./gradlew :composeApp:wasmJsBrowserDistribution"

[assets]
directory = "composeApp/build/dist/wasmJs/productionExecutable"
